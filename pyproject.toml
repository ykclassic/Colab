[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-agent-platform"
version = "0.4.0"
description = "Production-grade multi-agent collaboration platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "langgraph>=1.2.11,<2",
  "langgraph-checkpoint-postgres>=3.1.2,<4",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
ignore = ["E501", "RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.coverage.run]
omit = ["src/colab/production_persistence.py"]
